name: CI

on:
  push:
    # dev is the development branch and master the released one; claude/** are working branches. Every push to one
    # runs the full pipeline, so a branch is never reported as pushed without its tests having run on that exact commit
    branches: [master, dev, 'claude/**']
  pull_request:
    branches: [master, dev]
  # A manual run is possible too, but it does not replace the automatic run for a push
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the pipeline builds and tests; it never deploys and needs no secrets
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Gate order: each step must pass before the next one runs
      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Typecheck (Worker, web, tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Retired protocol check
        run: npm run check:legacy

      - name: Unit tests (web and i18n)
        run: npm run test:unit

      - name: Worker tests (Workers runtime)
        run: npm run test:worker

      - name: Route contract tests (docs/API.md)
        run: npm run test:contracts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Test report
        if: always()
        run: |
          npx vitest run --reporter=json --outputFile.json=test-results/vitest.json >/dev/null 2>&1 || true
          node scripts/test-report.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # High and critical advisories fail the pipeline; moderate ones are reported in the log
      - name: Audit (high and critical fail the build)
        run: npm run audit:high

      - name: Audit report (all severities, informational)
        run: npm audit --audit-level=moderate || true

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
